    <h1>Ovo Frito</h1>
    <ul>
        <li>Uma frigideira</li>
        <li>Sal</li>
        <li>1 ou 2 ovos (da galinha de preferencia)</li>
    </ul>
    <ol>
        <li>Quebra o ovo na frigideira</li>
        <li>Coloque sal no ovo</li>
        <li>Frite por 2 minutos</li>
        <li>Coma(O ovo frito pelo amor de deus)</li>
    </ol>
    <p>Eu gosto da receita</p>
